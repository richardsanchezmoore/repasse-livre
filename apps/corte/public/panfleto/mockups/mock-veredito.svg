<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="390" height="800" font-family="Georgia,'Times New Roman',serif">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e0d13"/><stop offset="1" stop-color="#160a0f"/></linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a1218"/><stop offset=".55" stop-color="#7c2b37"/><stop offset="1" stop-color="#4a1620"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7263"/><stop offset="1" stop-color="#2f4f43"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c2b37"/><stop offset="1" stop-color="#61202a"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="378" height="788" rx="46" fill="#0d0609" stroke="#2a2130" stroke-width="2"/>
  <rect x="18" y="18" width="354" height="764" rx="36" fill="url(#scr)"/>
  <clipPath id="clip"><rect x="18" y="18" width="354" height="764" rx="36"/></clipPath>
  <g clip-path="url(#clip)">
    <rect x="18" y="18" width="354" height="60" fill="url(#hdr)"/>
    <rect x="18" y="76.5" width="354" height="1.5" fill="#c69b4a"/>
    <text x="195" y="53" text-anchor="middle" fill="#d8b06a" font-size="14" letter-spacing="4" font-weight="bold">✦ DAMAS VIRTUOSAS ✦</text>
    <text x="195" y="118" text-anchor="middle" fill="#c69b4a" font-size="11.5" letter-spacing="2.4" font-weight="bold">◈ O SEU VEREDITO ◈</text>

    <!-- verdict card -->
    <rect x="34" y="136" width="322" height="300" rx="18" fill="url(#green)" stroke="#d8b06a" stroke-width="1.5"/>
    <text x="195" y="216" text-anchor="middle" fill="#ffffff" font-size="58" font-weight="bold">24 <tspan fill="#ffffff" fill-opacity=".55">/ 24</tspan></text>
    <text x="195" y="240" text-anchor="middle" fill="#ffffff" fill-opacity=".85" font-size="11" letter-spacing="2" font-weight="bold">PONTOS DA TEMPORADA</text>
    <text x="195" y="290" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">O Boaz da sua</text>
    <text x="195" y="320" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">Temporada</text>
    <text x="195" y="356" text-anchor="middle" fill="#ffffff" fill-opacity=".94" font-size="14">Os frutos revelam caráter, domínio</text>
    <text x="195" y="378" text-anchor="middle" fill="#ffffff" fill-opacity=".94" font-size="14">próprio e fé de raiz. Prossiga com</text>
    <text x="195" y="400" text-anchor="middle" fill="#ffffff" fill-opacity=".94" font-size="14">sabedoria, oração e alegria.</text>

    <!-- upsell card -->
    <rect x="34" y="454" width="322" height="150" rx="16" fill="#2c1319" stroke="#c69b4a" stroke-opacity=".22"/>
    <text x="195" y="486" text-anchor="middle" fill="#c69b4a" font-size="10.5" letter-spacing="2" font-weight="bold">ISTO FORAM SÓ 8 PERGUNTAS ✦</text>
    <text x="195" y="514" text-anchor="middle" fill="#f2e4cf" font-size="20" font-weight="bold">Quer investigar a fundo?</text>
    <text x="195" y="540" text-anchor="middle" fill="#c7b498" font-size="13">O Kit traz os 12 tipos, o Dossiê e o</text>
    <text x="195" y="558" text-anchor="middle" fill="#c7b498" font-size="13">Veredito completo — no seu celular.</text>
    <rect x="52" y="568" width="286" height="24" rx="8" fill="none"/>

    <!-- CTA pill -->
    <rect x="34" y="626" width="322" height="58" rx="14" fill="url(#cta)" stroke="#d8b06a" stroke-width="1.5"/>
    <text x="195" y="661" text-anchor="middle" fill="#fdf3dd" font-size="16" font-weight="bold">Conhecer o Kit completo  ›</text>

    <rect x="18" y="726" width="354" height="56" fill="#180b10"/>
    <rect x="18" y="726" width="354" height="1.5" fill="#c69b4a" fill-opacity=".22"/>
    <text x="195" y="759" text-anchor="middle" fill="#c7b498" font-size="12" letter-spacing="1">a decisão é sua — com os olhos abertos</text>
  </g>
</svg>
