    <text x="34" y="140" fill="#c69b4a" font-size="11.5" letter-spacing="2.4" font-weight="bold">◈ O VEREDITO REAL · PERGUNTA 3 ◈</text>
    <text x="34" y="177" fill="#f2e4cf" font-size="23" font-weight="bold">Quando você discorda</text>
    <text x="34" y="206" fill="#f2e4cf" font-size="23" font-weight="bold">dele, como ele reage?</text>
    <rect x="34" y="234" width="322" height="72" rx="15" fill="url(#sel)" stroke="#d8b06a" stroke-width="1.5"/>
    <text x="52" y="264" fill="#fdf3dd" font-size="15">Ouve com paciência e</text>
    <text x="52" y="286" fill="#fdf3dd" font-size="15">busca o entendimento.</text>
    <rect x="34" y="318" width="322" height="72" rx="15" fill="#2c1319" stroke="#c69b4a" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="52" y="348" fill="#f2e4cf" font-size="15">Fica em silêncio ou</text>
    <text x="52" y="370" fill="#f2e4cf" font-size="15">muda de assunto.</text>
    <rect x="34" y="402" width="322" height="72" rx="15" fill="#2c1319" stroke="#c69b4a" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="52" y="432" fill="#f2e4cf" font-size="15">Se irrita e inverte a</text>
    <text x="52" y="454" fill="#f2e4cf" font-size="15">culpa pra cima de você.</text>
    <rect x="18" y="726" width="354" height="56" fill="#180b10"/>
    <rect x="18" y="726" width="354" height="1.5" fill="#c69b4a" fill-opacity=".22"/>
    <text x="195" y="759" text-anchor="middle" fill="#c7b498" font-size="12" letter-spacing="1">toque para responder</text>
