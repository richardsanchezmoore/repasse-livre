<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="390" height="800" font-family="Georgia,'Times New Roman',serif">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e0d13"/><stop offset="1" stop-color="#160a0f"/></linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a1218"/><stop offset=".55" stop-color="#7c2b37"/><stop offset="1" stop-color="#4a1620"/></linearGradient>
    <linearGradient id="sel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c2b37"/><stop offset="1" stop-color="#61202a"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="378" height="788" rx="46" fill="#0d0609" stroke="#2a2130" stroke-width="2"/>
  <rect x="18" y="18" width="354" height="764" rx="36" fill="url(#scr)"/>
  <clipPath id="clip"><rect x="18" y="18" width="354" height="764" rx="36"/></clipPath>
  <g clip-path="url(#clip)">
    <rect x="18" y="18" width="354" height="60" fill="url(#hdr)"/>
    <rect x="18" y="76.5" width="354" height="1.5" fill="#c69b4a"/>
    <text x="195" y="53" text-anchor="middle" fill="#d8b06a" font-size="14" letter-spacing="4" font-weight="bold">✦ DAMAS VIRTUOSAS ✦</text>
    <rect x="34" y="98" width="60" height="7" rx="3.5" fill="#c69b4a"/>
    <rect x="100" y="98" width="60" height="7" rx="3.5" fill="#c69b4a"/>
    <rect x="166" y="98" width="60" height="7" rx="3.5" fill="#7c2b37"/>
    <rect x="232" y="98" width="60" height="7" rx="3.5" fill="#c69b4a" fill-opacity=".2"/>
